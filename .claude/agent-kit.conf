# agent-kit config for this repo. Sourced by the .claude/hooks/*.sh scripts (bash).
# Hook scripts are managed by /agent-kit and get overwritten on update; this file isn't.

# Short-term "where we left off" note, overwritten at the end of each task.
HANDOFF="docs/handoff.md"

# Long-term work ledger with [ ] / [~] / [x] status items.
PLAN="PLAN.md"

# Run at the end of a turn when BUILD_PATHS changed. Empty = no build check.
BUILD_CMD="npm run build"
BUILD_PATHS="src public astro.config.mjs package.json tsconfig.json"

# 'glob|reason' — edits to matching repo-relative paths are always blocked.
BLOCK=(
  'business/*|business/ is internal-only. Don'"'"'t edit it from the site repo.'
  'dist/*|dist/ is build output. Edit the source in src/ instead.'
  '.astro/*|.astro/ is generated. Edit the source in src/ instead.'
  'tailwind.config.*|This project doesn'"'"'t use Tailwind (see docs/decisions.md).'
)

# 'glob|reason' — creating NEW files at matching paths is blocked (edits are fine).
BLOCK_NEW=(
  '*.css|All styles go in src/styles/global.css (see docs/decisions.md).'
  '*.scss|All styles go in src/styles/global.css (see docs/decisions.md).'
)
